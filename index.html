91d55}.softlink{font-size:10px;color:#d7c8da}.note{margin-top:45px;color:#c8b8d0;font-size:10px;line-height:1.7<div class="announce">✷ A curl-loving, colour-loving hair sanctuary · Bandra, Mumbai ✷</div><header class="nav"><a class="brand" href="#top">h<i>i</i>th<small>HAPPY IN THE HEAD</small></a><nav class="navlinks"><a href="#world">Our world</a><a href="#services">Hair rituals</a><a href="#stories">Hair stories</a><a href="#academy">Academy</a></nav><a class="pill" href="https://wa.me/919819622325?text=Hi%20Happy%20In%20The%20Head%2C%20I%27d%20love%20to%20book%20a%20hair%20consultation." target="_blank" rel="noreferrer">Plan a visit ↗</a></header><main id="top"><section class="hero"><div class="copy"><p class="kicker">EST. 2011 · BANDRA, MUMBAI</p><h1>Come as you are.<br><em>Leave in your element.</em></h1><p class="intro">A happy place for curls, waves and unapologetic colour. Thoughtful hair, made with a little art, a lot of heart, and room to be completely you.</p><div class="actions"><a class="btn" href="https://wa.me/919819622325?text=Hi%20Happy%20In%20The%20Head%2C%20I%27d%20love%20to%20plan%20a%20visit.">Begin a conversation ↗</a><a class="softlink" href="#stories">Explore the hair stories ↓</a></div><p class="note">✳ &nbsp;<b>Good hair starts with listening.</b><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Every appointment begins with you.</p></div><div class="orb" aria-label="Animated vivid colour artwork"></div><span class="star">✧</span><div class="herofoot"><span>For hair that feels like you</span><span>SCROLL TO WANDER ↓</span><span>19°03' N · 72°50' E</span></div></section><div class="ticker"><div>✷ CURL CURIOUS <i>✷</i> VIVID COLOUR <i>✷</i> HAIR WITH HEART <i>✷</i> ART, NATURE & MAGICK <i>✷</i> CURL CURIOUS <i>✷</i> VIVID COLOUR <i>✷</i> HAIR WITH HEART <i>✷</i></div></div><section class="wrap" id="world"><p class="eyebrow">01 / A SANCTUARY FOR YOUR CROWN</p><div class="split"><h2>Hair is personal.<br><em>So is the way we care.</em></h2><div class="body"><p>Happy In The Head began with a love for the hair people were told to tame. Today, founder Avani Yashwin and the team celebrate curls, waves, vivid colour and the many ways people choose to show up.</p><p>Come for the craft. Stay for the conversation, the calm, and the feeling of being understood.</p><a href="https://www.instagram.com/happyinthehead/" target="_blank" rel="noreferrer">Meet us on Instagram ↗</a></div></div></section><section class="values"><article class="value"><span>〰</span><b>Curl curious</b><p>Texture-first cuts and care that let your natural pattern take the lead.</p></article><article class="value"><span>✷</span><b>Colour fearless</b><p>Personal colour stories, from softly luminous to joyfully vivid.</p></article><article class="value"><span>♡</span><b>People first</b><p>A thoughtful consultation and a welcoming salon experience.</p></article></section><section class="wrap" id="services"><p class="eyebrow">02 / HAIR RITUALS</p><div class="servicehead"><h2>Your hair,<br><em>your way.</em></h2><p class="body">Tell us what you’re dreaming of, what your hair is doing today, and what you want life with it to feel like. We’ll figure out the rest together.</p></div><div class="rows"><article class="row"><small>01</small><div><h3>Curls & waves</h3><p>Texture-aware cuts · shape refresh · styling guidance</p></div><span class="icon">〰</span><p>Explore shape, movement and practical care for your own curl and wave journey.</p><a href="https://wa.me/919819622325?text=Hi%2C%20I%27d%20like%20to%20talk%20about%20a%20curl%20or%20wave%20appointment.">↗</a></article><article class="row"><small>02</small><div><h3>Vivid colour</h3><p>Colour consultation · expressive transformations</p></div><span class="icon">✷</span><p>A shade that feels like a story only you could tell. Start with a conversation about your vision.</p><a href="https://wa.me/919819622325?text=Hi%2C%20I%27d%20love%20to%20discuss%20a%20colour%20consultation.">↗</a></article><article class="row"><small>03</small><div><h3>Cut & restyle</h3><p>Personalised cuts · shape changes · fresh starts</p></div><span class="icon">⌁</span><p>A cut that works with your texture, routine and the person you’re becoming.</p><a href="https://wa.me/919819622325?text=Hi%2C%20I%27d%20like%20to%20talk%20about%20a%20cut%20or%20restyle.">↗</a></article><article class="row"><small>04</small><div><h3>Learn your hair</h3><p>Curly & wavy hair care workshops</p></div><span class="icon">✺</span><p>Build confidence with your hair at home. Ask about upcoming learning sessions.</p><a href="https://wa.me/919819622325?text=Hi%2C%20could%20you%20tell%20me%20about%20your%20hair%20care%20workshops%3F">↗</a></article></div><p class="fine">Every service begins with a consultation. Timing, colour plans and pricing are discussed with your stylist.</p></section><section class="colour"><div class="rings" aria-hidden="true"><i></i><i></i><i></i></div><div><p class="eyebrow">A NOTE FROM OUR WORLD</p><h2>Let your hair<br><em>take up space.</em></h2><p class="body">From a quiet shape shift to a colour you can see from across the room, your next chapter can begin with one conversation.</p><a class="btn" href="https://wa.me/919819622325?text=Hi%20Happy%20In%20The%20Head%2C%20I%27d%20love%20to%20talk%20through%20a%20hair%20idea.">Tell us your idea ↗</a></div></section><section class="wrap" id="stories"><p class="eyebrow">03 / REAL HAIR STORIES</p><div class="galleryhead"><h2>Made with love.<br><em>Shared with magick.</em></h2><p class="body">Curls, colour, community and the people behind the chair, through the Happy In The Head Instagram.</p></div><div class="cards"><article class="card"><label>01 · CURLS & WAVES</label><blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/happyinthehead/reel/DFpsSDkIg3c/" data-instgrm-version="14"></blockquote></article><article class="card"><label>02 · THE HITH STORY</label><blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/happyinthehead/reel/DLeiW5DiPtK/" data-instgrm-version="14"></blockquote></article><article class="card"><label>03 · SALON MOMENTS</label><blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/happyinthehead/p/DcTpnVTAENK/" data-instgrm-version="14"></blockquote></article><article class="card"><label>04 · ART OF A CUT</label><blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/happyinthehead/reel/DcdBUVggz0H/" data-instgrm-version="14"></blockquote></article><article class="card"><label>05 · OUR PEOPLE</label><blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/happyinthehead/p/DeBNHEwAoOi/" data-instgrm-version="14"></blockquote></article><article class="card"><label>06 · HAIR WITH HEART</label><blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/happyinthehead/reel/DZ2ekdbogVO/" data-instgrm-version="14"></blockquote></article></div><p class="fine">Posts and reels from <a href="https://www.instagram.com/happyinthehead/" target="_blank" rel="noreferrer">@happyinthehead ↗</a></p></section><section class="academy" id="academy"><div class="seal">HITH<small>ACADEMY</small>✷</div><div><p class="eyebrow">FOR THE CURL-CURIOUS</p><h2>More confidence<br>between wash days.</h2><p>Happy In The Head shares curl and wave know-how through workshops. Learn practical ways to care for, style and understand your hair.</p><a class="btn" href="https://wa.me/919819622325?text=Hi%2C%20I%27m%20interested%20in%20a%20curl%20and%20wave%20hair%20care%20workshop.">Ask about workshops ↗</a></div><div class="scrib">learn<br><em>love</em><br>repeat ✧</div></section><section class="wrap visit" id="visit"><div><p class="eyebrow">04 / COME SAY HELLO</p><h2>Let’s make<br><em>something feel like you.</em></h2><p class="body">Share your hair goals and the team can guide you toward a consultation. Message for appointments and workshop details.</p><a class="btn" style="background:#291638;color:white" href="https://wa.me/919819622325?text=Hi%20Happy%20In%20The%20Head%2C%20I%27d%20love%20to%20plan%20a%20visit.">WhatsApp the salon ↗</a></div><aside class="visitcard"><p class="eyebrow">FIND YOUR WAY TO US ✳</p><h3>Happy In The Head</h3><p>Bandra West<br>Mumbai, Maharashtra</p><p>Call or WhatsApp<br><a href="tel:+919819622325">+91 98196 22325</a></p><p><a href="https://www.instagram.com/happyinthehead/" target="_blank" rel="noreferrer">@happyinthehead ↗</a></p><p>Planning ahead is a good idea. Message the team to find a time that works.</p></aside></section><section class="cta"><p class="eyebrow">YOUR HAIR HAS A STORY</p><h2>We’d love to hear it.</h2><a class="btn" href="https://wa.me/919819622325?text=Hi%20Happy%20In%20The%20Head%2C%20I%27d%20love%20to%20talk%20about%20my%20hair.">Start with a hello ↗</a></section></main><footer class="footer"><a class="brand" href="#top">h<i>i</i>th<small>HAPPY IN THE HEAD</small></a><span>For curls, colour & all the lovely in between.</span><a href="https://www.instagram.com/happyinthehead/" target="_blank" rel="noreferrer">Instagram ↗</a><small>© 2026 Happy In The Head · Website concept</small></footer><script async src="https://www.instagram.com/embed.js"></script><script>window.addEventListener('load',()=>window.instgrm?.Embeds?.process())</script></body></html>
